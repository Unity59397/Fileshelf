<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FileShelf: utilities for single-player PC games</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/*
  FileShelf design tokens.
  Layout concept: a library with a terminal flavour. A featured game opens the front page with a console
  window beside it that types itself out, then a scrolling row of game tiles, then three steps.
  Colour: cool paper, one amber accent, a green reserved for "free", eight muted cover tints.
  Light is the default. Dark mode is a hidden setting: click the >_ in the header.
  Type: Bricolage Grotesque for headings, Instrument Sans for reading, JetBrains Mono for the logo, console and file names.
*/
:root {
  color-scheme: light;
  --paper: #f1f1f4;
  --surface: #ffffff;
  --hover: #f6f6f9;
  --ink: #14141a;
  --muted: #5a5a68;
  --line: #d6d6de;
  --accent: #ffb020;
  --accent-strong: #e89b00;
  --accent-text: #8a5600;
  --accent-ink: #14141a;
  --free: #0c7a52;
  --free-ink: #ffffff;
  --focus: #8a5600;
  --scrim: rgba(241, 241, 244, 0.94);
  --scrim-fade: rgba(241, 241, 244, 0.55);
  --t1: #dce4ff;
  --t2: #d6efe4;
  --t3: #fbe2d3;
  --t4: #e9def6;
  --t5: #f8dce6;
  --t6: #eeeccb;
  --t7: #d3e9f2;
  --t8: #f3e8c7;
  /* The console window stays dark in both themes, like a real terminal. */
  --term-bg: #0e0e13;
  --term-line: #2a2a35;
  --term-ink: #e9e9ef;
  --term-muted: #8b8b99;
  --term-prompt: #ffb020;
  --term-ok: #4fdc9e;

  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-file: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --fs-sm: 0.875rem;
  --fs-body: 1.0625rem;
  --fs-lead: clamp(1.125rem, 1.05rem + 0.4vw, 1.3125rem);
  --fs-h3: 1.25rem;
  --fs-h2: clamp(1.625rem, 1.3rem + 1.2vw, 2.25rem);
  --fs-h1: clamp(2.5rem, 1.5rem + 4.5vw, 4.75rem);

  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #14141a;
  --surface: #1c1c24;
  --hover: #262631;
  --ink: #f2f2f5;
  --muted: #a0a0ae;
  --line: #2e2e3a;
  --accent: #ffb020;
  --accent-strong: #ffc24d;
  --accent-text: #ffb020;
  --accent-ink: #14141a;
  --free: #4fdc9e;
  --free-ink: #0f1a15;
  --focus: #ffb020;
  --scrim: rgba(20, 20, 26, 0.94);
  --scrim-fade: rgba(20, 20, 26, 0.55);
  --t1: #1d2748;
  --t2: #15332b;
  --t3: #3a2418;
  --t4: #2c2145;
  --t5: #3a1f2c;
  --t6: #2f3016;
  --t7: #1b3340;
  --t8: #36301d;
  --term-bg: #0a0a0f;
  --term-line: #2e2e3a;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: 1.55;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.file { font-family: var(--font-file); font-size: 0.875rem; overflow-wrap: anywhere; }
.us { color: var(--accent-text); }
.skip { position: absolute; left: -999px; top: 0; background: var(--ink); color: var(--paper); padding: 0.6rem 1rem; z-index: 20; }
.skip:focus { left: 0; }

/* Page width and side gutter. Set once here, never on the elements inside. */
.wrap {
  width: 100%;
  max-width: 76rem;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
.site-head { border-bottom: 1px solid var(--line); }
.site-head .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem 2rem; padding-block: 0.9rem; }
.head-right { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1.5rem; }
.brand { display: inline-flex; align-items: baseline; font: 700 1.35rem/1 var(--font-file); letter-spacing: -0.03em; }
.brand-mark { font: inherit; letter-spacing: inherit; color: var(--accent-text); background: none; border: 0; padding: 0.3rem 0; cursor: pointer; border-radius: 4px; }
.brand-mark .us { display: inline-block; }
.brand-mark:hover .us, .brand-mark:focus-visible .us { animation: blink 1s steps(1) infinite; }
.brand-name { text-decoration: none; color: var(--ink); padding: 0.3rem 0; }
.nav { display: flex; gap: 1.5rem; list-style: none; margin: 0; padding: 0; }
.nav a { display: inline-block; padding: 0.35rem 0; text-decoration: none; font-weight: 600; border-bottom: 2px solid transparent; }
.nav a:hover { border-bottom-color: var(--line); }
.nav a[aria-current="page"] { border-bottom-color: var(--accent); }

/* Bands */
.band { padding-block: clamp(2.5rem, 6vw, 4.5rem); }
.band-alt { background: var(--surface); border-block: 1px solid var(--line); }
.band h2 { font-weight: 700; font-size: var(--fs-h2); line-height: 1.1; letter-spacing: -0.02em; }
.band-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 0.75rem 1.5rem; margin-bottom: 1.5rem; }
.band-head p { margin-top: 0.4rem; }
.more { color: var(--accent-text); font-weight: 600; text-decoration: underline; text-underline-offset: 0.25em; text-decoration-thickness: 1.5px; }
.lead { font-size: var(--fs-lead); color: var(--muted); max-width: 38rem; line-height: 1.5; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; text-align: center; min-height: 3rem; padding: 0.65rem 1.25rem; border-radius: 8px; border: 1.5px solid transparent; font: 600 1rem/1.25 var(--font-body); text-decoration: none; cursor: pointer; transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
.btn-sm { min-height: 2.5rem; padding: 0.4rem 1rem; font-size: 0.95rem; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-strong); }
.btn-line { border-color: var(--ink); color: var(--ink); background: transparent; }
.btn-line:hover { background: var(--ink); color: var(--paper); }
.btn-free { border-color: var(--free); color: var(--free); background: transparent; }
.btn-free:hover { background: var(--free); color: var(--free-ink); }
.btn-block { width: 100%; }
.actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 2rem; }

/* Pills */
.tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.pill { display: inline-flex; align-items: center; padding: 0.3rem 0.75rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: var(--fs-sm); font-weight: 600; }
.pill-free { border-color: var(--free); color: var(--free); }

/* Featured hero */
.hero-feature { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.hero-bg { position: absolute; inset: 0; background: var(--surface); }
.hero-bg::before { content: ""; position: absolute; inset: 0; z-index: 0; opacity: 0.45;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 3rem 3rem; }
.hero-bg img { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-bg::after { content: ""; position: absolute; z-index: 2; inset: 0; background: linear-gradient(90deg, var(--scrim) 0%, var(--scrim-fade) 100%); }
.hero-grid { position: relative; z-index: 3; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: clamp(2rem, 5vw, 4rem); align-items: center; padding-block: clamp(3rem, 9vw, 7rem); }
.hero-copy h1 { font-weight: 780; font-size: var(--fs-h1); line-height: 1.02; letter-spacing: -0.035em; margin-bottom: 0.9rem; }
.hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; }
.codebox { font: 700 0.875rem/1 var(--font-file); color: var(--accent-text); border: 1.5px solid var(--accent-text); border-radius: 4px; padding: 0.3rem 0.6rem; }
@media (max-width: 52rem) { .hero-grid { grid-template-columns: minmax(0, 1fr); } }

/* Console window */
.term { background: var(--term-bg); border: 1px solid var(--term-line); border-radius: 10px; overflow: hidden; font-family: var(--font-file); font-size: 0.875rem; color: var(--term-ink); }
.term-bar { display: flex; align-items: center; gap: 0.9rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--term-line); color: var(--term-muted); }
.dots { display: inline-flex; gap: 0.45rem; flex: none; }
.dots i { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: #ff5f57; }
.dots i:nth-child(2) { background: #febc2e; }
.dots i:nth-child(3) { background: #28c840; }
.term-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.term-body { margin: 0; padding: 1rem 1.1rem 1.25rem; font: inherit; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
.term-body .pr { color: var(--term-prompt); }
.term-body .ok { color: var(--term-ok); }
.cursor { color: var(--term-prompt); animation: blink 1.1s steps(1) infinite; }
.caret { color: var(--term-prompt); }
@keyframes blink { 50% { opacity: 0; } }

/* Cover tints */
.t1 { background: var(--t1); }
.t2 { background: var(--t2); }
.t3 { background: var(--t3); }
.t4 { background: var(--t4); }
.t5 { background: var(--t5); }
.t6 { background: var(--t6); }
.t7 { background: var(--t7); }
.t8 { background: var(--t8); }

/* Game cards and the scrolling row */
.cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); gap: 1.25rem; }
.cards.rail { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(15rem, 16rem); overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 1rem; scrollbar-width: thin; }
.rail > li { scroll-snap-align: start; }
.rail-nav { display: flex; gap: 0.5rem; }
.rail-btn { position: relative; width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; transition: border-color 0.15s; }
.rail-btn:hover { border-color: var(--ink); }
.rail-btn::before { content: ""; position: absolute; left: 50%; top: 50%; width: 0.6rem; height: 0.6rem; border-top: 2px solid currentColor; border-right: 2px solid currentColor; }
.rail-next::before { transform: translate(-65%, -50%) rotate(45deg); }
.rail-prev::before { transform: translate(-35%, -50%) rotate(-135deg); }
.rail-foot { margin-top: 0.75rem; }
@media (max-width: 40rem) { .rail-nav { display: none; } }
.card { position: relative; height: 100%; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; transition: border-color 0.15s; }
.card:hover { border-color: var(--accent); }
.card:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.cover { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-bottom: 1px solid var(--line); }
.cover::before { content: ""; position: absolute; z-index: 1; top: 0; left: 1rem; width: 3.5rem; height: 0.5rem; background: var(--surface); border-radius: 0 0 4px 4px; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover-ext { position: absolute; left: 1rem; bottom: 0.5rem; font: 780 3.5rem/1 var(--font-display); letter-spacing: -0.04em; }
.badge { position: absolute; z-index: 2; top: 0.75rem; right: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.78rem; font-weight: 700; background: var(--free); color: var(--free-ink); }
.card-body { display: flex; flex-direction: column; gap: 0.35rem; padding: 1rem; flex: 1; }
.card-cat { font-size: var(--fs-sm); color: var(--muted); }
.card h3 { font-size: var(--fs-h3); font-weight: 700; letter-spacing: -0.01em; }
.card h3 a { text-decoration: none; }
.card h3 a::after { content: ""; position: absolute; inset: 0; }
.card-sum { color: var(--muted); font-size: 0.95rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; margin-top: auto; padding-top: 0.75rem; }
.price-sm { font: 700 1.25rem var(--font-display); }
.size-sm { font: 400 0.8rem var(--font-file); color: var(--muted); }

/* Three steps */
.howgrid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.25rem; }
.how { display: flex; flex-direction: column; height: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.how-img { position: relative; aspect-ratio: 16 / 9; border-bottom: 1px solid var(--line); }
.how-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.how-num { position: absolute; left: 1.25rem; bottom: 0.5rem; font: 780 3.5rem/1 var(--font-display); letter-spacing: -0.04em; }
.how-body { padding: 1.25rem; display: grid; gap: 0.6rem; align-content: start; }
.how-body h3 { font-size: var(--fs-h3); font-weight: 700; letter-spacing: -0.01em; }
.how-body p { color: var(--muted); }
.how-body .ticks { margin-top: 0.4rem; }
@media (max-width: 52rem) { .howgrid { grid-template-columns: minmax(0, 1fr); } }

/* Ticks and features */
.ticks, .features { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
.features { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem 3rem; margin-top: 1.5rem; }
.ticks li, .features li { position: relative; padding-left: 2rem; max-width: 34rem; }
.ticks li::before, .features li::before { content: ""; position: absolute; left: 0.1rem; top: 0.3em; width: 0.95rem; height: 0.5rem; border-left: 2.5px solid var(--accent-text); border-bottom: 2.5px solid var(--accent-text); transform: rotate(-45deg); }
@media (max-width: 40rem) { .features { grid-template-columns: minmax(0, 1fr); } }

/* Free band */
.freeband { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1.5rem 3rem; background: var(--surface); border: 1px solid var(--free); border-radius: 10px; padding: clamp(1.5rem, 4vw, 2.5rem); }
.freeband h2 { margin-bottom: 0.5rem; }
.freeband p { max-width: 38rem; color: var(--muted); }

/* Games page */
.page-head { padding-block: clamp(2rem, 5vw, 3.5rem) 1.5rem; }
.page-head h1 { font-weight: 780; font-size: clamp(2.25rem, 1.6rem + 3vw, 3.75rem); line-height: 1.05; letter-spacing: -0.03em; margin-bottom: 0.75rem; }
.filters { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem 1.5rem; margin-bottom: 1.5rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chip { font: 600 0.9rem/1 var(--font-body); padding: 0.6rem 1rem; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; transition: background-color 0.15s, border-color 0.15s; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Game page */
.crumbs { font-size: var(--fs-sm); color: var(--muted); padding-block: 1.25rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
.crumbs a { text-underline-offset: 0.2em; }
.product-top { padding-bottom: clamp(2rem, 5vw, 3.5rem); }
.product { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: clamp(1.5rem, 4vw, 3.5rem); align-items: start; }
@media (max-width: 52rem) { .product { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.slot { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; text-align: center; padding: 1rem; color: var(--muted); }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slot-hint { display: grid; gap: 0.25rem; justify-items: center; border: 1.5px dashed var(--muted); border-radius: 8px; padding: 1.25rem 1.5rem; max-width: 90%; }
.slot-hint b { font: 700 1.1rem var(--font-display); color: var(--ink); }
.slot-hint span { font-size: var(--fs-sm); }
.thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.6rem; margin-top: 0.75rem; }
.thumbs button { position: relative; aspect-ratio: 16 / 10; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; cursor: pointer; background: none; color: var(--ink); }
.thumbs button[aria-current="true"] { outline: 2.5px solid var(--accent-text); outline-offset: 2px; }
.slot-num { position: relative; font: 700 1.1rem var(--font-display); }
.buybox { display: grid; gap: 1rem; }
.buybox h1 { font-weight: 780; font-size: clamp(2rem, 1.5rem + 2.5vw, 3.25rem); line-height: 1.04; letter-spacing: -0.03em; }
.price-line { display: flex; align-items: baseline; gap: 0.75rem; }
.price { font: 760 2.25rem/1 var(--font-display); letter-spacing: -0.02em; }
.buy-actions { display: grid; gap: 0.75rem; }
.status { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 0.75rem 1rem; font-size: 0.95rem; }
.spec { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.6rem 1.25rem; font: 400 0.875rem/1.5 var(--font-file); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.1rem; }
.spec dt { color: var(--muted); }
.spec dd { margin: 0; overflow-wrap: anywhere; }

.table-scroll { position: relative; margin-top: 1.5rem; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
table { border-collapse: collapse; width: 100%; min-width: 30rem; }
th, td { padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid var(--line); }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
th { font-weight: 600; }
thead th { font-size: var(--fs-sm); color: var(--muted); }
.c { text-align: center; width: 8rem; }
.yes { color: var(--free); font-weight: 700; }
.no { color: var(--muted); }

/* Help */
.help-row { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr); gap: 0.75rem 3rem; padding-block: 1.75rem; border-top: 1px solid var(--line); }
.help-row h2 { font-size: var(--fs-h3); font-weight: 700; letter-spacing: -0.01em; }
.help-row p { max-width: 62ch; }
.help-row p + p { margin-top: 0.75rem; }
.mail { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin-top: 0.75rem; }
@media (max-width: 40rem) { .help-row { grid-template-columns: minmax(0, 1fr); } }

/* Footer */
.site-foot { border-top: 1px solid var(--line); padding-block: 2rem; font-size: var(--fs-sm); color: var(--muted); }
.site-foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem 2rem; }
.site-foot .nav a { font-weight: 500; }

/* Theme message */
.toast { position: fixed; z-index: 30; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--term-bg); color: var(--term-ink); border: 1px solid var(--term-line); border-radius: 6px; padding: 0.55rem 0.9rem; font: 500 0.85rem/1.3 var(--font-file); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ===== Marketplace additions ===== */
:root {
  --danger: #b3261e;
  --danger-bg: #fbe9e7;
  --pending: #8a5600;
}
:root[data-theme="dark"] {
  --danger: #ff8f85;
  --danger-bg: #3a1c19;
  --pending: #ffb020;
}

.band-flush { padding-top: 0; }
#content:focus { outline: none; }
.narrow-form { max-width: 40rem; }
.review > .stack-sm, .review > .review-form { flex: 1 1 100%; }
.narrow { max-width: 30rem; }
.stack { display: grid; align-content: start; gap: 1.25rem; }
.stack-sm { display: grid; align-content: start; gap: 0.6rem; }
.row-flex { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
.right { margin-left: auto; }

}

<script>window.FILESHELF = { demo: true };</script>
<script>
// Runs before the page paints, so a saved dark-mode choice does not flash light first.
(function () {
  try {
    var t = localStorage.getItem('fileshelf-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();

// Shared helpers. Everything hangs off window.FS so the pages can be plain script files.
(function (FS) {
  'use strict';

  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return ESC[c]; });
  }

  // html`...` escapes everything you put in it unless it is already trusted markup.
  function Raw(s) { this.s = s; }
  function raw(s) { return new Raw(s); }
  function val(v) {
    if (v == null || v === false) return '';
    if (v instanceof Raw) return v.s;
    if (Array.isArray(v)) return v.map(val).join('');
    return esc(v);
  }
  function html(strings) {
    var out = '';
    for (var i = 0; i < strings.length; i++) {
      out += strings[i];
      if (i + 1 < strings.length) out += val(arguments[i + 1]);
    }
    return new Raw(out);
  }

  function money(pence) {
    var pounds = pence / 100;
    return '£' + (pence % 100 === 0 ? String(pounds) : pounds.toFixed(2));
  }
  function size(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    return (bytes / 1024 / 1024 / 1024).toFixed(1) + ' GB';
  }
  // Accepts a timestamp, or a plain date such as "2022-02-25" (shown as that day wherever the reader is).
  function date(ts) {
    var d = typeof ts === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(ts)
      ? new Date(Number(ts.slice(0, 4)), Number(ts.slice(5, 7)) - 1, Number(ts.slice(8, 10)))
      : new Date(ts);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function dateTime(ts) {
    return new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function qs(obj) {
    var parts = [];
    Object.keys(obj).forEach(function (k) {
      if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') {
        parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(obj[k]));
      }

    return parts.length ? '?' + parts.join('&') : '';

  function paragraphs(text) {
    return html`${String(text).split(/(?:\r?\n){2,}/).map(function (p) { return html`<p>${p}</p>`; })}`;
  }

  var STATUS = {
    pending: 'Waiting for review',
    approved: 'Live',
    rejected: 'Changes needed',
    withdrawn: 'Withdrawn',
    removed: 'Removed',
  };
  function pill(status) {
    return html`<span class="pill pill-${status}">${STATUS[status] || status}</span>`;
  }

  function cover(game, coverId) {
    return html`<div class="cover t${game.tint}">${coverId ? html`<img data-slot src="${FS.api.imageUrl(coverId)}" alt="" loading="lazy">` : ''}<span class="cover-ext">${game.code}<span class="us">_</span></span></div>`;
  }

  var priceText = function (l) { return l.price_pence === 0 ? 'Free' : money(l.price_pence); };

  function card(l) {
    var badge = l.is_demo ? html`<span class="badge badge-demo">Demo data</span>`
      : l.price_pence === 0 ? html`<span class="badge">Free</span>`
      : l.has_free ? html`<span class="badge">Free version</span>` : '';
    return html`<li><article class="card">
      <div class="cover t${l.game.tint}">${l.cover_id ? html`<img data-slot src="${FS.api.imageUrl(l.cover_id)}" alt="" loading="lazy">` : ''}<span class="cover-ext">${l.game.code}<span class="us">_</span></span>${badge}</div>
      <div class="card-body">
        <p class="card-cat">${l.game.name}${l.category ? html` &middot; ${l.category.name}` : ''}</p>
        <h3><a href="#/listing/${l.id}">${l.title}</a></h3>
        <p class="card-sum">${l.summary}</p>
        <p class="card-foot"><span class="price-sm">${priceText(l)}</span><span class="size-sm">${l.seller_display || l.seller}</span></p>
      </div></article></li>`;
  }

  // A game as a tile. Used on the home page and in the Intel directory.
  function gameTile(g) {
    return html`<li><article class="card game-tile">
      <div class="cover t${g.tint}"><span class="cover-ext">${g.code}<span class="us">_</span></span></div>
      <div class="card-body">
        <h3><a href="#/games/${g.slug}">${g.name}</a></h3>
        <p class="card-sum">${[g.developer, g.release_date ? g.release_date.slice(0, 4) : ''].filter(Boolean).join(', ')}</p>
        <p class="card-foot"><span class="size-sm">${g.listings} ${g.listings === 1 ? 'utility' : 'utilities'}</span></p>
      </div></article></li>`;
  }

  function creatorCard(c) {
    return html`<li><article class="card person">
      <div class="card-body">
        <h3><a href="#/creators/${c.username}">${c.display_name}</a></h3>
        <p class="card-sum">${c.bio || 'No bio yet.'}</p>
        <p class="card-foot"><span class="size-sm">${plural(c.listings, 'listing')}</span></p>
      </div></article></li>`;
  }

  // What a scan result means. Never says a file is safe: a scan cannot promise that.
  function scanText(status) {
    if (status === 'clean') return 'Scanned, nothing found. A scan cannot promise a file is safe.';
    return 'Not scanned. Treat the file with care.';
  }

  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many || one + 's'); }

  // Small message at the bottom of the screen.
  var toastEl, toastTimer;
  function toast(message) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      toastEl.setAttribute('role', 'status');
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = '> ' + message;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);

  var calm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // Writes HTML into a <pre> one character at a time, keeping the colours of its spans.
  function typeInto(pre, htmlStr) {
    return new Promise(function (resolve) {
      var holder = document.createElement('span');
      holder.innerHTML = htmlStr;
      pre.appendChild(holder);
      var nodes = [];
      (function walk(n) {
        Array.prototype.forEach.call(n.childNodes, function (c) {

      function tick() {

<li><a href="#/sell" ${cur('sell')}>Sell</a></li>
<li><a href="#/help" ${cur('help')}>Help</a></li>
</ul></nav>
<div class="head-account">${account}</div>
<button class="menu-btn" type="button" data-sheet-toggle aria-expanded="false" aria-controls="site-sheet">Menu</button>
</div>
<div class="mega sheet" id="site-sheet" hidden>
<div class="mega-inner">
<div class="mega-head"><span></span><h2>Menu</h2><button class="mega-close" type="button" data-sheet-close aria-label="Close menu"></button></div>
<ul class="mega-list" aria-label="Pages">${sheetRows.map(function (r) { return menuRow(r[0], r[1]); })}</ul>
<ul class="mega-list" aria-label="Account">${u
  ? html`${accountLinks().map(function (l) { return menuRow(l[0], l[1]); })}<li><button class="sheet-out" type="button" data-signout>Sign out (${u.username})</button></li>`
  : html`${menuRow('#/signin', 'Sign in')}${menuRow('#/signup', 'Sign up')}`}</ul>
</div></div>
</div></header>`.s;
    menu.open = false;
    sheet.open = false;
    acct.open = false;
    root.classList.remove('menu-open');
    fillMenu();
  }

  // ---- Browse menu: a list of games and shortcuts ----
  // On a computer it drops down when the pointer rests on Browse. On a phone it fills the screen.
  var menu = { open: false, hold: false, timer: null, games: null, categories: null };
  var sheet = { open: false };
  var acct = { open: false };
  var narrowQuery = window.matchMedia('(max-width: 48rem)');
  var hoverQuery = window.matchMedia('(hover: hover)');
  var canHover = function () { return hoverQuery.matches && !narrowQuery.matches; };

  function menuShell() {
    return html`<div class="mega" id="browse-menu" hidden>
<div class="mega-inner">
<div class="mega-head"><span></span><h2>Browse</h2><button class="mega-close" type="button" data-menu-close aria-label="Close menu"></button></div>
<div class="mega-side"><ul class="mega-list mega-short" aria-label="Shortcuts"></ul>
<ul class="mega-list mega-cats" aria-label="Categories"></ul></div>
<ul class="mega-list mega-games" aria-label="Games"></ul>
</div></div>`;
  }
  function menuRow(href, name, extra) {
    return html`<li><a href="${href}"><span class="mega-name">${name}</span>${extra || ''}<span class="mega-chev" aria-hidden="true"></span></a></li>`;
  }
  function fillMenu() {
    var short = header.querySelector('.mega-short');
    var cats = header.querySelector('.mega-cats');
    var list = header.querySelector('.mega-games');
    if (!short || !list) return;
    var games = menu.games || [];
    var total = games.reduce(function (n, g) { return n + g.listings; }, 0);
    var paid = state.config && state.config.payments && state.config.payments !== 'off';
    short.innerHTML = html`${menuRow('#/browse', 'All listings', menu.games ? html`<span class="mega-count">${total}</span>` : '')}${menuRow('#/browse?sort=updated', 'Recently updated')}${menuRow('#/browse?featured=1', 'Featured')}${paid ? html`${menuRow('#/browse?free=1', 'Free only')}${menuRow('#/browse?sort=price_asc', 'Lowest price first')}` : ''}`.s;
    cats.innerHTML = html`${(menu.categories || []).map(function (c) {
      return menuRow('#/browse?category=' + c.id, c.name, html`<span class="mega-count">${c.listings}</span>`);
    })}`.s;
    list.innerHTML = html`${games.map(function (g) {
      return html`<li><a href="#/browse?game=${g.slug}"><span class="mega-code">${g.code}<span class="us">_</span></span><span class="mega-name">${g.name}</span><span class="mega-count">${g.listings}</span><span class="mega-chev" aria-hidden="true"></span></a></li>`;
    })}`.s;
  }
  function loadMenuGames() {
    FS.api.games().then(function (g) { menu.games = g; fillMenu(); }, function () {});
    FS.api.categories().then(function (c) { menu.categories = c; fillMenu(); }, function () {});
  }
  function lockScroll() {
    root.classList.toggle('menu-open', (menu.open || sheet.open) && narrowQuery.matches);
  }
  function setMenu(open) {
    var m = document.getElementById('browse-menu');
    if (!m) return;
    if (open) { setSheet(false); setAcct(false); }
    menu.open = open;
    m.hidden = !open;
    var item = header.querySelector('[data-browse-item]');
    if (item) item.classList.toggle('is-open', open);
    var toggle = header.querySelector('[data-menu-toggle]');
    if (toggle) toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    lockScroll();
    if (open && narrowQuery.matches) { var close = m.querySelector('[data-menu-close]'); if (close) close.focus(); }
  }
  function setSheet(open) {
    var m = document.getElementById('site-sheet');
    if (!m) return;
    if (open) { setMenu(false); setAcct(false); }
    sheet.open = open;
    m.hidden = !open;
    var toggle = header.querySelector('[data-sheet-toggle]');
    if (toggle) toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    lockScroll();
    if (open) { var close = m.querySelector('[data-sheet-close]'); if (close) close.focus(); }
  }
  function setAcct(open) {
    var m = document.getElementById('acct-menu');
    if (!m) return;
    if (open) { setMenu(false); }
    acct.open = open;
    m.hidden = !open;
    var toggle = header.querySelector('[data-acct-toggle]');
    if (toggle) toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function renderFooter() {
    var cfg = state.config || {};
    footer.innerHTML = html`<footer class="site-foot"><div class="wrap">
<p>FileShelf. Utilities for single-player PC games.</p>
<nav aria-label="Footer"><ul class="nav"><li><a href="#/help">Help</a></li><li><a href="#/terms">Content rules</a></li>${cfg.contact_email ? html`<li><a href="mailto:${cfg.contact_email}">Contact</a></li>` : ''}</ul></nav>
<p class="foot-note">Game names, logos and Steam data belong to their owners. FileShelf is not affiliated with Valve or any game publisher.</p>
</div></footer>`.s;
  }

  // ---- Rendering a page ----
  var token = 0;

  function makeCtx(m, query) {
    return {
      api: FS.api,
      state: state,
      params: m.params,
      query: query,
      navigate: function (path) { go(path); },
      reload: function () { render(true); },
      setTitle: function (t) { document.title = t; },
      refreshHeader: renderHeader,
      requireUser: function (next) {
        if (!state.user) throw new Redirect('/signin' + FS.ui.qs({ next: next }));
      },
    };
  }

  function render(keepScroll) {
    var mine = ++token;
    var parsed = splitFull(currentFull());
    var m = match(parsed.path);
    activeRoute = m.route;
    renderHeader();
    loadMenuGames();
    var page = FS.pages[m.page];
    var ctx = makeCtx(m, parsed.query);
    content.setAttribute('aria-busy', 'true');

    var y = window.pageYOffset;
    Promise.resolve()
      .then(function () { return page.render(ctx); })
      .then(function (view) {
        if (mine !== token) return;
        content.innerHTML = view.s;
        content.removeAttribute('aria-busy');
        if (page.mount) page.mount(content, ctx);
        if (keepScroll === true) window.scrollTo(0, y);
        else { window.scrollTo(0, 0); content.focus({ preventScroll: true }); }
      })
      .catch(function (err) {
        if (mine !== token) return;
        if (err instanceof Redirect) { go(err.path, true); return; }
        content.removeAttribute('aria-busy');
        if (err && err.status === 401) { go('/signin' + FS.ui.qs({ next: parsed.path }), true); return; }
        if (err && err.status === 404) {
          FS.pages.notfound.render(ctx).then(function (v) { content.innerHTML = v.s; });
          return;
        }
        if (!(err instanceof FS.ApiError) && window.console) console.error(err);
        content.innerHTML = html`<section class="page-head"><div class="wrap">
<h1>Something went wrong</h1>
<p class="lead">${err instanceof FS.ApiError ? err.message : 'This page could not be shown.'}</p>
<p><button class="btn btn-line" type="button" data-retry>Try again</button></p></div></section>`.s;
      });
  }

  // ---- Clicks anywhere ----
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t.closest) return;

    if (menu.open && !t.closest('[data-browse-item]')) setMenu(false);
    if (acct.open && !t.closest('[data-acct]')) setAcct(false);

    if (t.closest('[data-acct-toggle]')) { setAcct(!acct.open); return; }
    if (t.closest('[data-sheet-toggle]')) { setSheet(!sheet.open); return; }
    if (t.closest('[data-sheet-close]')) {
      setSheet(false);
      var menuBtn = header.querySelector('[data-sheet-toggle]');
      if (menuBtn) menuBtn.focus();
      return;
    }

    if (t.closest('[data-menu-toggle]')) { setMenu(!menu.open); return; }
    if (t.closest('[data-menu-close]')) {
      setMenu(false);
      var back = header.querySelector('[data-menu-toggle]');
      if (back) back.focus();
      return;
    }
    // Without a pointer to hover with, tapping Browse opens the list. "All listings" is the first row.
    if (t.closest('[data-browse-link]') && !canHover()) { e.preventDefault(); setMenu(!menu.open); return; }

    var link = t.closest('a[href^="#/"]');
    // After choosing something, keep the list shut until the pointer leaves Browse.
    if (link && link.closest('[data-browse-item]')) menu.hold = true;
    if (link && !e.defaultPrevented && e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey) {
      e.preventDefault();
      go(link.getAttribute('href').slice(1));
      return;
    }
    if (t.closest('[data-skip]')) { e.preventDefault(); content.focus(); return; }

    if (t.closest('[data-retry]')) { render(); return; }

    if (t.closest('[data-signout]')) {
      FS.api.logout().then(function () {
        state.user = null;
        FS.ui.toast('Signed out');
        go('/');
      }, function (err) { FS.ui.toast(err.message); });
      return;
    }

    if (t.closest('[data-demo-reset]')) {
      FS.demoApi.reset();
      state.user = null;
      FS.ui.toast('Demo reset');
      go('/');
      return;
    }

    var toggle = t.closest('[data-theme-toggle]');
    if (toggle) {
      var next = isDark() ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('fileshelf-theme', next); } catch (err) {}
      document.querySelectorAll('[data-theme-toggle]').forEach(function (b) {
        b.setAttribute('aria-pressed', next === 'dark' ? 'true' : 'false');
      });
      FS.ui.toast(next + ' mode on');
      echoTheme(next);
    }
  });

  // The home page console answers when the theme changes.
  function echoTheme(name) {
    var pre = content.querySelector('.term-body[data-type]');
    if (!pre || pre.hasAttribute('data-busy')) return;
    var old = pre.querySelector('.cursor');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var line = 'theme --set ' + name + '\n<span class="ok">[ OK ]</span> ' + name + ' mode on\n<span class="pr">$</span> <span class="cursor" aria-hidden="true">_</span>';
    if (FS.ui.calm) { pre.insertAdjacentHTML('beforeend', line); return; }
    pre.setAttribute('data-busy', '1');
    FS.ui.typeInto(pre, line).then(function () { pre.removeAttribute('data-busy'); });
  }

  document.addEventListener('mouseover', function (e) {
    if (!canHover() || !e.target.closest) return;
    if (e.target.closest('[data-browse-item]')) {
      clearTimeout(menu.timer);
      if (!menu.open && !menu.hold) setMenu(true);
    } else if (menu.hold) {
      menu.hold = false;
    } else if (menu.open) {
      clearTimeout(menu.timer);
      menu.timer = setTimeout(function () { setMenu(false); }, 220);
    }
  });
  document.addEventListener('mouseout', function (e) {
    if (canHover() && menu.open && !e.relatedTarget) {
      clearTimeout(menu.timer);
      menu.timer = setTimeout(function () { setMenu(false); }, 220);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var inside = header.contains(document.activeElement);
    if (menu.open) {
      setMenu(false);
      var toggle = header.querySelector('[data-menu-toggle]');
      if (inside && toggle) toggle.focus();
    }
    if (sheet.open) {
      setSheet(false);
      var menuBtn = header.querySelector('[data-sheet-toggle]');
      if (inside && menuBtn) menuBtn.focus();
    }
    if (acct.open) {
      setAcct(false);
      var acctBtn = header.querySelector('[data-acct-toggle]');
      if (inside && acctBtn) acctBtn.focus();
    }
  });
  narrowQuery.addEventListener('change', function () { if (menu.open) setMenu(false); if (sheet.open) setSheet(false); });

  // When an image cannot load, remove it so the placeholder underneath shows.
  document.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'IMG' && t.hasAttribute('data-slot') && t.parentNode) t.parentNode.removeChild(t);
  }, true);

  window.addEventListener('hashchange', function () {
    if (FS.demo) return;
    var h = window.location.hash;
    if (h === '' || h.indexOf('#/') === 0) render();
  });

  // ---- Start ----
  Promise.all([
    FS.api.me().then(function (u) { state.user = u; }, function () { state.user = null; }),
    FS.api.config().then(function (c) { state.config = c; }, function () { state.config = null; }),
  ]).then(function () {
    renderFooter();
    render();
  });
})((window.FS = window.FS || {}));

</script>
</body>
</html>
